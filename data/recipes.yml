    label: 60 g smoked salmon
  - food: butter
    grams: 20
    label: 20 g butter
  - food: creme-fraiche
    grams: 15
    label: 1 tbsp crème fraîche
  - food: rye-bread
    grams: 35
    label: 1 slice rye bread (optional)
  steps:
