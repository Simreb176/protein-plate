# The recipe shelf — every meal the generator can choose from.
#
# One block per recipe. The generator picks from these to build a day, so the
# more you add, the more varied the plans become.
#
# Fields:
#   slug       the recipe's web address (lowercase, hyphens, never reuse)
#   title      what it's called
#   slot       breakfast | lunch | dinner | snack
#   diet       omnivore | pescatarian | vegetarian | vegan
#              (the strictest group it fits — vegan recipes suit everyone)
#   minutes    hands-on time, roughly
#   calories   per serving, kcal
#   protein    per serving, grams
#   carbs, fat per serving, grams
#   allergens  any of: dairy, gluten, eggs, fish, shellfish, soy, nuts, sesame
#   tags       short labels shown on the card (free text)
#   ingredients  one line per ingredient
#   steps      one line per step
#   note       optional serving suggestion

- slug: greek-yoghurt-berry-bowl
  title: Greek Yoghurt Berry Bowl
  slot: breakfast
  diet: vegetarian
  minutes: 5
  calories: 420
  protein: 34
  carbs: 40
  fat: 12
  allergens: [dairy]
  tags: [no-cook, quick]
  ingredients:
    - 300 g 0% Greek yoghurt
    - 80 g mixed berries
    - 40 g granola
    - 1 tsp honey
  steps:
    - Spoon the yoghurt into a bowl and swirl through half the berries.
    - Top with the rest of the berries and the granola, then drizzle with honey.
  note: Add a spoon of peanut butter if you need the extra calories.

- slug: smoked-salmon-scrambled-eggs
  title: Smoked Salmon Scrambled Eggs
  slot: breakfast
  diet: pescatarian
  minutes: 10
  calories: 460
  protein: 38
  carbs: 4
  fat: 32
  allergens: [dairy, eggs, fish]
  tags: [quick, high-protein]
  ingredients:
    - 3 eggs
    - 60 g smoked salmon
    - 20 g butter
    - 1 tbsp crème fraîche
    - 1 slice rye bread (optional)
  steps:
    - Beat the eggs with a pinch of salt and pepper.
    - Melt the butter in a pan over a low heat, add the eggs and stir slowly until just set.
    - Fold through the crème fraîche and smoked salmon off the heat. Serve with the rye toast if you like.

- slug: overnight-oats-whey
  title: Overnight Oats with Whey
  slot: breakfast
  diet: vegetarian
  minutes: 5
  calories: 480
  protein: 36
  carbs: 55
  fat: 13
  allergens: [dairy, gluten]
  tags: [make-ahead, no-cook]
  ingredients:
    - 60 g rolled oats
    - 200 ml semi-skimmed milk
    - 1 scoop (30 g) whey protein
    - 1 tbsp chia seeds
    - 60 g raspberries
  steps:
    - Stir the oats, milk, protein powder and chia together in a jar.
    - Seal and leave in the fridge overnight.
    - Top with the raspberries before eating.

- slug: tofu-scramble-sourdough
