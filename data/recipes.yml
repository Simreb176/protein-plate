# The recipe shelf — every meal the generator can choose from.
#
# One block per recipe. The generator picks from these to build a day, so the
# more you add, the more varied the plans become.
#
# Fields:
#   slug       the recipe's web address (lowercase, hyphens, never reuse)
#   title      what it's called
#   slot       breakfast | lunch | dinner | snack
#   diet       omnivore | pescatarian | vegetarian | vegan
#              (the strictest group it fits — vegan recipes suit everyone)
#   minutes    hands-on time, roughly
#   servings   how many servings the ingredient amounts make
#   allergens  any of: dairy, gluten, eggs, fish, shellfish, soy, nuts, sesame
#   tags       short labels shown on the card (free text)
#   ingredients  one row per ingredient: food (a key in foods.yml), grams,
#                and an optional label for the website
#   steps      one line per step
#   note       optional serving suggestion
#
# Calories, protein, carbs, fat and fibre are calculated at build time from
# data/foods.yml (CoFID 2021). Don't type them in here.

- slug: greek-yoghurt-berry-bowl
  title: Greek Yoghurt Berry Bowl
  slot: breakfast
  diet: vegetarian
  minutes: 5
  servings: 1
  allergens: [dairy]
  tags: [no-cook, quick]
  ingredients:
  - food: greek-yoghurt-0
    grams: 300
    label: 300 g 0% Greek yoghurt
  - food: mixed-berries
    grams: 80
    label: 80 g mixed berries
  - food: granola
    grams: 40
    label: 40 g granola
  - food: honey
    grams: 7
    label: 1 tsp honey
  steps:
  - Spoon the yoghurt into a bowl and swirl through half the berries.
  - Top with the rest of the berries and the granola, then drizzle with honey.
  note: Add a spoon of peanut butter if you need the extra calories.

- slug: smoked-salmon-scrambled-eggs
